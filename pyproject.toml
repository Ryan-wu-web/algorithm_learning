[project]
  name = "llm-learning"
  version = "0.1.0"
  description = "全栈开发转大模型学习项目"
  requires-python = ">=3.12,<3.13"
  dependencies = [
    "httpx>=0.28.1",
    "openai>=2.50.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
  package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
